<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Etichette A4 - Gestione Campi Vuoti</title>
  <style>
    @page { size: A4; margin: 5mm 0 5mm 0; }
    html, body { height: 100%; margin: 0; padding: 0; font-family: Arial, sans-serif; background: #fff; }

    #sheet {
      width: 210mm;
      height: 287mm;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(6, 1fr);
      margin: 0 auto;
      background: #fff;
      box-sizing: border-box;
    }
    .label {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      font-size: 10pt;
      padding: 2mm 4mm; 
      background: none;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      min-height: 0;
      min-width: 0;
      position: relative;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .label:hover { background: #e8f0fa; }
    .label-content {
      width: 100%;
      white-space: pre-line;
      font-family: Arial, sans-serif;
      font-size: 10pt;
      color: #111;
      pointer-events: none;
      z-index: 2;
      position: relative;
    }
    .watermark {
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      font-family: Arial, sans-serif;
      font-size: 62pt;
      font-weight: bold;
      color: #bcd;
      opacity: 0.37;
      text-align: center;
      letter-spacing: 0.1em;
      user-select: none;
      transition: opacity 0.2s;
    }
    .label[filled="1"] .watermark {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #actions-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin: 20px auto 18px auto;
      align-items: center;
    }
    .action-btn {
      padding: 12px 34px;
      font-size: 18px;
      background: #1d72b8;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-weight: 600;
      transition: background 0.2s;
    }
    .action-btn:hover { background: #145283; }

    /* MODAL/overlay form */
    #overlay {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.18);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 38px 60px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.17);
      min-width: 630px;
      max-width: 98vw;
      min-height: 380px;
    }
    #modal-form input[type='text'],
    #modal-form textarea {
      font-family: Arial, sans-serif;
      border: 1px solid #999;
      width: 100%;
      box-sizing: border-box;
      border-radius: 2px;
      padding: 8px 10px;
      font-size: 1.1em;
    }
    #modal-form textarea {
      min-height: 190px;
      resize: vertical;
    }
    #modal-form label { font-size: 1em; font-weight: bold; }
    #modal-form .form-row { display: flex; flex-direction: column; gap: 5px; }
    #modal-form .actions { display: flex; gap: 22px; margin-top: 16px; justify-content: flex-end; align-items: center;}
    #modal-form button {
      padding: 10px 24px;
      font-size: 1.1em;
      border-radius: 3px;
      border: none;
      background: #1d72b8;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background .13s;
    }
    #modal-form button:hover { background: #15548c; }
    #cancella-cella {
      background: #e44;
      margin-right: auto;
    }
    #cancella-cella:hover { background: #a10; }

    /* MODALE DI CONFERMA custom */
    #confirm-overlay {
      display:none; position:fixed; top:0; left:0;right:0;bottom:0; background:rgba(0,0,0,0.2); z-index:200;
      align-items:center; justify-content:center;
    }
    #confirm-box {
      background:#fff; border-radius:9px; padding:38px 45px; min-width:340px; max-width:93vw;
      box-shadow:0 8px 38px rgba(0,0,0,0.19);
      font-family:Arial,sans-serif;
      display:flex; flex-direction:column; gap:28px;
    }
    #confirm-box .msg { font-size:1.18em; color:#222; line-height: 1.4; }
    #confirm-box .cf-btns { display:flex; gap:16px; justify-content:flex-end;}
    .cf-btn { padding:10px 27px; border:none; border-radius:3px; font-size:1.11em; font-weight:bold; cursor:pointer; }
    .cf-ok { background:#1d72b8;color:#fff;}
    .cf-ok:hover {background:#15548c;}
    .cf-cancel { background:#bbb;color:#333;}
    .cf-cancel:hover {background:#888;}

    @media print {
      #actions-bar, #overlay, .watermark, #confirm-overlay { display: none !important; }
      body, html { background: #fff !important; }
      #sheet { display: grid !important; }
      .label { background: none !important; box-shadow: none !important; cursor: default !important; }
      .label:hover { background: none !important; }
    }
  </style>
</head>
<body>
  <!-- Barra azioni per stampa/resetta -->
  <div id="actions-bar">
    <button id="print-btn" class="action-btn">Stampa PDF</button>
    <button id="reset-btn" class="action-btn" style="background:#e44;">Cancella tutto</button>
  </div>
  <div id="sheet">
    <!-- 12 etichette con filigrana numerica -->
    <div class="label" data-idx="0" filled="0"><div class="label-content"></div><div class="watermark">1</div></div>
    <div class="label" data-idx="1" filled="0"><div class="label-content"></div><div class="watermark">2</div></div>
    <div class="label" data-idx="2" filled="0"><div class="label-content"></div><div class="watermark">3</div></div>
    <div class="label" data-idx="3" filled="0"><div class="label-content"></div><div class="watermark">4</div></div>
    <div class="label" data-idx="4" filled="0"><div class="label-content"></div><div class="watermark">5</div></div>
    <div class="label" data-idx="5" filled="0"><div class="label-content"></div><div class="watermark">6</div></div>
    <div class="label" data-idx="6" filled="0"><div class="label-content"></div><div class="watermark">7</div></div>
    <div class="label" data-idx="7" filled="0"><div class="label-content"></div><div class="watermark">8</div></div>
    <div class="label" data-idx="8" filled="0"><div class="label-content"></div><div class="watermark">9</div></div>
    <div class="label" data-idx="9" filled="0"><div class="label-content"></div><div class="watermark">10</div></div>
    <div class="label" data-idx="10" filled="0"><div class="label-content"></div><div class="watermark">11</div></div>
    <div class="label" data-idx="11" filled="0"><div class="label-content"></div><div class="watermark">12</div></div>
  </div>
  <!-- Overlay/Modal inserimento e modifica -->
  <div id="overlay">
    <form id="modal-form" autocomplete="off">
      <div class="form-row">
        <label for="num-atto">Numero atto:</label>
        <input type="text" id="num-atto" maxlength="30">
      </div>
      <div class="form-row">
        <label for="annotazione">Annotazione:</label>
        <textarea id="annotazione" maxlength="800"></textarea>
      </div>
      <div class="form-row">
        <label for="city-date">Città/Data:</label>
        <input type="text" id="city-date" maxlength="40">
      </div>
      <div class="actions">
        <button type="button" id="cancella-cella">Cancella cella</button>
        <button type="button" id="annulla">Annulla</button>
        <button type="submit">OK</button>
      </div>
    </form>
  </div>
  <!-- Overlay per modale conferma custom -->
  <div id="confirm-overlay">
    <div id="confirm-box">
      <div class="msg" id="confirm-msg"></div>
      <div class="cf-btns">
        <button class="cf-btn cf-cancel" id="cf-cancel" type="button">Annulla</button>
        <button class="cf-btn cf-ok" id="cf-ok" type="button">Conferma</button>
      </div>
    </div>
  </div>
  <script>
    function showConfirm(msg, cb) {
      const overlay = document.getElementById('confirm-overlay');
      const m = document.getElementById('confirm-msg');
      const bCancel = document.getElementById('cf-cancel');
      const bOk = document.getElementById('cf-ok');
      m.textContent = msg;
      overlay.style.display = 'flex';
      setTimeout(() => bCancel.focus(), 150);
      bCancel.onclick = () => { overlay.style.display = 'none'; cb(false); };
      bOk.onclick = () => { overlay.style.display = 'none'; cb(true); };
      overlay.onkeydown = e => { if(e.key === "Escape") { overlay.style.display = 'none'; cb(false); }};
    }

    function getDataOggi() {
      let d = new Date();
      return ("0"+d.getDate()).slice(-2)+'/'+("0"+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
    }

    const etichette = Array(12).fill().map(() => ({atto:"", nota:"", cd:""}));
    let currentIdx = null;

    const overlay = document.getElementById("overlay");
    const modal = document.getElementById("modal-form");
    const inputAtto = document.getElementById("num-atto");
    const inputNota = document.getElementById("annotazione");
    const inputCd = document.getElementById("city-date");
    const btnAnnulla = document.getElementById("annulla");
    const btnCancellaCella = document.getElementById("cancella-cella");
    const btnPrint = document.getElementById("print-btn");
    const btnReset = document.getElementById("reset-btn");

    function aggiornaEtichetta(idx) {
      const { atto, nota, cd } = etichette[idx];
      let txt = [atto, nota, cd].filter(Boolean).join('\n');
      document.querySelector(`.label[data-idx="${idx}"] .label-content`).textContent = txt;
      const isFilled = txt.length > 0 ? "1" : "0";
      document.querySelector(`.label[data-idx="${idx}"]`).setAttribute('filled', isFilled);
    }

    function resetEtichette() {
      for(let idx = 0; idx < 12; ++idx) {
        etichette[idx] = {atto:"", nota:"", cd:""};
        aggiornaEtichetta(idx);
      }
    }

    function salvaDati() {
        if (currentIdx === null) return;
        etichette[currentIdx] = {
            atto: inputAtto.value.trim(),
            nota: inputNota.value.trim(),
            cd: inputCd.value.trim()
        };
        aggiornaEtichetta(currentIdx);
        overlay.style.display = 'none';
        currentIdx = null;
    }

    document.querySelectorAll('.label').forEach((lab, idx) => {
      lab.addEventListener("click", () => {
        currentIdx = idx;
        const { atto, nota, cd } = etichette[idx];
        inputAtto.value = atto || '';
        inputNota.value = nota || '';
        inputCd.value = cd || `Viterbo, ${getDataOggi()}`;
        overlay.style.display = "flex";
        setTimeout(() => inputAtto.focus(), 150);
      });
    });

    btnAnnulla.addEventListener("click", () => { overlay.style.display = "none"; });

    btnCancellaCella.addEventListener("click", () => {
      if(currentIdx === null) return;
      showConfirm('Vuoi cancellare il contenuto di questa cella?', ok => {
        if(ok) {
          etichette[currentIdx] = {atto:"", nota:"", cd:""};
          aggiornaEtichetta(currentIdx);
          overlay.style.display = "none";
          currentIdx = null;
        }
      });
    });

    modal.addEventListener("submit", e => {
        e.preventDefault();
        const campiVuoti = [];
        if (!inputAtto.value.trim()) campiVuoti.push("Numero atto");
        if (!inputNota.value.trim()) campiVuoti.push("Annotazione");
        if (!inputCd.value.trim()) campiVuoti.push("Città/Data");

        if (campiVuoti.length > 0) {
            const msg = `I seguenti campi sono vuoti:\n${campiVuoti.join(', ')}.\n\nProcedere comunque?`;
            showConfirm(msg, ok => {
                if (ok) salvaDati();
            });
        } else {
            salvaDati();
        }
    });

    window.addEventListener("keydown", e => {
      if(e.key === "Escape" && overlay.style.display === "flex") {
        overlay.style.display = "none";
      }
    });

    btnReset.addEventListener("click", () => {
      showConfirm('Sei sicuro di voler cancellare tutte le etichette?', ok => {
        if(ok) resetEtichette();
      });
    });

    btnPrint.addEventListener("click", () => window.print());


    resetEtichette(); // Inizializza al caricamento
  </script>
</body>
</html>
